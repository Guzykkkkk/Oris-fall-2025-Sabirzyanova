<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> FAMILY - Форсаж</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: wheat;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            width: 100%;
            height: 10%;
            background-color: cadetblue;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .header-logo {
            width: 10%;
            text-align: right;
        }

        .header-logo img {
            max-height: 60px;
            width: auto;
        }
        .Main_color-button {
            transition: transform 0.3s;
            border-radius: 5px;
        }

        .Main_color-button:hover {
            transform: scale(1.05);
        }

        .header-title {
            flex-grow: 1;
            text-align: center;
            color: wheat;
        }

        .header-title h1 {
            font-size: 3em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header-spacer {
            width: 80%;
        }

        .main-content {
            flex-grow: 1;
            width: 100%;
            background-color: cornflowerblue;
            display: flex;
            flex-direction: column;
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 10px;
            flex-grow: 1;
        }

        .character-card {
            text-align: center;
            padding: 5px;
        }

        .character-card h2 {
            color: rgba(14, 14, 18, 0.8);
            background-color: cornflowerblue;
            padding: 5px;
            border-radius: 5px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .character-card img {
            width: 200px;
            height: 250px;
            object-fit: cover;
            border: 3px solid #2c5754;
            border-radius: 5px;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .character-card img:hover {
            transform: scale(1.05);
        }

        .navigation {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 20px;
            gap: 10px;
        }

        .back-button-container {
            text-align: center;
            padding: 30px;
            text-decoration: none;
        }

        .back-button {
            background-color: #375859;
            color: #ffffff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 25px;
            transition: background-color 0.3s;
            text-decoration: none;

        }

        .back-button:hover {
            background-color: indigo;
            text-decoration: none;
        }

        .footer {
            width: 100%;
            height: 10%;
            background-color: cadetblue;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .footer-logo {
            width: 5%;
            text-align: right;
        }

        .footer-logo img {
            max-height: 40px;
            width: auto;
        }

        .footer-title {
            flex-grow: 1;
            text-align: center;
            color: wheat;
        }

        .footer-title h1 {
            font-size: 1.5em;
            margin: 0;
        }

        .footer-spacer {
            width: 80%;
        }

        @media (max-width: 1200px) {
            .characters-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .characters-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .header-title h1 {
                font-size: 2em;
            }

            .character-card img {
                width: 150px;
                height: 200px;
            }

            .navigation {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .characters-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                height: auto;
                padding: 10px;
            }

            .header-logo, .header-spacer {
                width: 100%;
                text-align: center;
            }

            .header-title h1 {
                font-size: 1.5em;
            }

            .character-card img {
                width: 100%;
                max-width: 200px;
                height: auto;
            }
        }
    </style>
</head>
<body>
